name: CI CD Angular

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  tests-and-build:
    name: Tests, Lint et Build
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code source
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Executer les tests
        run: npm test -- --watch=false

      - name: Verifier le code avec ESLint
        run: npm run lint

      - name: Compiler Angular pour GitHub Pages
        run: npm run build -- --base-href /ci-cd-angular-staging/

      - name: Envoyer les fichiers de publication
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/ci-cd-angular-staging/browser

  deploy-production:
    name: Deployer en production
    runs-on: ubuntu-latest
    needs: tests-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
